import streamlit_authenticator as stauth
import bcrypt

# ⚠️ SENHA PADRÃO
SENHA_PADRAO = 'certifica123'

# Gera hash novo
novo_hash = stauth.Hasher.hash(SENHA_PADRAO)

print("=" * 70)
print(f"Senha padrão definida: {SENHA_PADRAO}")
print(f"Hash gerado: {novo_hash}")
print(f"Tamanho do hash: {len(novo_hash)} caracteres")
print("=" * 70)

# Valida
resultado = bcrypt.checkpw(SENHA_PADRAO.encode('utf-8'), novo_hash.encode('utf-8'))
print(f"Hash válido para '{SENHA_PADRAO}'? {resultado}")
print("=" * 70)

# Reescreve o config.yaml automaticamente
config_content = f"""credentials:
  usernames:
    admin:
      email: admin@caucaia.ce.gov.br
      name: Administrador
      password: {novo_hash}
      role: admin
    vigilancia:
      email: vigilancia@caucaia.ce.gov.br
      name: Equipe de Vigilância
      password: {novo_hash}
      role: user

cookie:
  expiry_days: 1
  key: painel_sifilis_key_2026
  name: painel_sifilis_cookie

preauthorized:
  emails: []
"""

with open('config.yaml', 'w', encoding='utf-8') as f:
    f.write(config_content)

print("✅ config.yaml LOCAL reescrito com sucesso!")
print(f"⚠️ A senha padrão dos usuários 'admin' e 'vigilancia' é: {SENHA_PADRAO}")
print("=" * 70)
